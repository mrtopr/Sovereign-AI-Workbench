<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Sovereign Gold / Amber Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Emerald / Cyan AI Ring Gradient -->
    <linearGradient id="aiRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Sovereign Armor Base -->
  <polygon points="32,3 58,16 58,48 32,61 6,48 6,16" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />

  <!-- Inner Tech Circuit Ring -->
  <circle cx="32" cy="32" r="21" stroke="url(#aiRingGrad)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6" />

  <!-- Neural Nodes & Data Beams -->
  <circle cx="32" cy="11" r="2.2" fill="#38bdf8" />
  <circle cx="53" cy="23" r="2.2" fill="#38bdf8" />
  <circle cx="53" cy="41" r="2.2" fill="#10b981" />
  <circle cx="32" cy="53" r="2.2" fill="#10b981" />
  <circle cx="11" cy="41" r="2.2" fill="#38bdf8" />
  <circle cx="11" cy="23" r="2.2" fill="#38bdf8" />

  <line x1="32" y1="13" x2="32" y2="18" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />
  <line x1="51" y1="24" x2="46" y2="27" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />
  <line x1="13" y1="24" x2="18" y2="27" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />

  <!-- Refinery Tower Silhouette & Hydrocarbon Flame -->
  <!-- Industrial Tower Base -->
  <path d="M26 46 L38 46 L36 34 L28 34 Z" fill="#334155" stroke="#64748b" stroke-width="1" />
  <line x1="27" y1="40" x2="37" y2="40" stroke="#94a3b8" stroke-width="0.8" />

  <!-- Sovereign AI Petro-Flame -->
  <path d="M32 16 C35 23 41 27 41 33 C41 38 37 42 32 42 C27 42 23 38 23 33 C23 27 29 23 32 16 Z" 
        fill="url(#flameGrad)" 
        filter="url(#glow)" />
  
  <!-- Core Plasma Center -->
  <path d="M32 23 C33.5 27 37 29 37 33 C37 36 34.8 38 32 38 C29.2 38 27 36 27 33 C27 29 30.5 27 32 23 Z" 
        fill="#ffffff" 
        opacity="0.9" />
</svg>
